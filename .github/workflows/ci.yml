name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Unit & integration tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Run e2e tests
        run: pnpm e2e

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
  docker-smoke:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: dumbscope:smoke
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (boots, setup code printed, health + provenance OK)
        run: |
          docker run -d --name dumbscope-smoke -p 8091:8091 dumbscope:smoke
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8091/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8091/api/health | grep -q '"status":"ok"'
          docker logs dumbscope-smoke 2>&1 | grep -q 'Setup code'
          # The container must report the exact commit it was built from.
          reported="$(curl -sf http://127.0.0.1:8091/api/health/live | jq -r '.buildSha')"
          if [ "$reported" != "${{ github.sha }}" ]; then
            echo "::error::smoke image reports buildSha='$reported', expected '${{ github.sha }}'"
            exit 1
          fi
          docker rm -f dumbscope-smoke > /dev/null
