name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Unit & integration tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  docker-smoke:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dumbscope:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (boots, setup code printed, health OK)
        run: |
          docker run -d --name dumbscope-smoke -p 8091:8091 dumbscope:smoke
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8091/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8091/api/health | grep -q '"status":"ok"'
          docker logs dumbscope-smoke 2>&1 | grep -q 'Setup code'
          docker rm -f dumbscope-smoke > /dev/null
