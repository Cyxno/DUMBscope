name: Publish v0.9.1 to GHCR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.9.1-ghcr.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.9.1
        uses: actions/checkout@v4
        with:
          ref: v0.9.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push v0.9.1
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cyxno/dumbscope:0.9.1
            ghcr.io/cyxno/dumbscope:0.9
            ghcr.io/cyxno/dumbscope:latest
          build-args: |
            BUILD_SHA=21366fb
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
