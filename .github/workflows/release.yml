name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history + all remote branches: the release guard needs to compare
      # the fix/hardening branches against main before anything is published.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release guard (v0.9.3): fail before ANY build/publish step while a
      # fix/*, hardening/* or release-blocker/* branch carries commits that
      # never reached main — that is how v0.9.1/v0.9.2 shipped without the
      # symlink namespace-guard and regressed production. Additive: the
      # provenance check below stays in place.
      - name: Release guard — fix/hardening branches merged or allowlisted
        run: scripts/check-release-branches.sh

      - name: Gather build metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ steps.meta.outputs.sha }}
            BUILD_DATE=${{ steps.meta.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Provenance verification: the same Dockerfile/args path must yield an
      # image whose runtime reports EXACTLY the release commit. Built locally
      # (single-arch, --load) purely as a wiring check for the pushed tags.
      - name: Verify image reports the release commit
        run: |
          docker build --load \
            --build-arg BUILD_SHA=${{ steps.meta.outputs.sha }} \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.time }} \
            -t dumbscope:provenance .
          docker run -d --name dumbscope-provenance -p 8091:8091 dumbscope:provenance
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8091/api/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          reported="$(curl -sf http://127.0.0.1:8091/api/health/live | jq -r '.buildSha')"
          docker rm -f dumbscope-provenance > /dev/null
          if [ "$reported" != "${{ steps.meta.outputs.sha }}" ]; then
            echo "::error::image reports buildSha='$reported' but release commit is '${{ steps.meta.outputs.sha }}'"
            exit 1
          fi
          echo "image provenance OK: buildSha=$reported"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
